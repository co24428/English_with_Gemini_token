<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini English Practice</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --primary: #2563eb;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .flex-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    input, select, textarea {
      padding: 0.55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      min-height: 80px;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
    }
    .tab-btn {
      flex: 1;
      background: #e2e8f0;
      color: #334155;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .chat-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f1f5f9;
      height: 320px;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .msg {
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      max-width: 85%;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #dbeafe;
      border: 1px solid #bfdbfe;
    }
    .msg.gemini {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .keyword-display {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e3a8a;
      background: #eff6ff;
      border: 1px dashed #93c5fd;
      padding: 0.75rem;
      border-radius: 6px;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Key Management -->
  <div class="card flex-row" style="justify-content: space-between;">
    <div class="flex-row">
      <label><strong>API Key:</strong></label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." style="width: 240px;" />
      <button onclick="saveKey()">Save</button>
    </div>
    <span id="keyStatus" style="font-size: 0.85rem; color: #64748b;">Not saved</span>
  </div>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabBtn1" onclick="switchTab('main')">Function 1: Keyword Practice</button>
    <button class="tab-btn" id="tabBtn2" onclick="switchTab('roleplay')">Function 2: Custom Roleplay</button>
  </div>

  <!-- Main Function: Random Keywords + Test Prep/Deep Talk -->
  <div id="mainMode" class="card">
    <div class="flex-row" style="margin-bottom: 0.75rem;">
      <button onclick="fetchRandomTopic()" id="randomBtn">🎲 Get Random Topic/Keyword</button>
      <label style="margin-left: auto;"><strong>Mode:</strong></label>
      <select id="practiceMode">
        <option value="test">Exam / Test Prep (Grammar & Expressions)</option>
        <option value="deep">Deep Conversation (Thought-Provoking)</option>
      </select>
    </div>

    <div class="keyword-display" id="keywordBox">Click the button above to generate a keyword topic.</div>

    <textarea id="keywordReply" placeholder="Type your response or thoughts on this topic..."></textarea>
    <div style="margin-top: 0.5rem; text-align: right;">
      <button onclick="sendKeywordResponse()" id="keywordSubmitBtn">Send to Gemini</button>
    </div>

    <div id="keywordFeedback" style="margin-top: 1rem; display: none;">
      <strong>Gemini's Response:</strong>
      <div id="feedbackText" class="msg gemini" style="width: 100%; box-sizing: border-box; margin-top: 0.5rem;"></div>
    </div>
  </div>

  <!-- Sub Function: Custom Persona Chat -->
  <div id="roleplayMode" class="card" style="display: none;">
    <div style="margin-bottom: 0.75rem;">
      <label><strong>Define Persona:</strong></label>
      <input type="text" id="personaInput" 
             placeholder="e.g. Mexican friend in Vancouver who worked with me before at a café" 
             value="A Mexican friend in Vancouver who worked with me before"
             style="width: 100%; box-sizing: border-box; margin-top: 0.35rem;" />
    </div>

    <div class="chat-box" id="chatHistory"></div>

    <div class="flex-row">
      <textarea id="chatInput" placeholder="Say something in English..." style="flex: 1; min-height: 50px;"></textarea>
      <button onclick="sendRoleplayMessage()" style="height: 50px;" id="chatSendBtn">Send</button>
      <button onclick="resetRoleplay()" style="height: 50px; background: #64748b;">Reset</button>
    </div>
  </div>
</div>

<script>
  let chatHistory = [];

  // Key storage
  window.onload = () => {
    const saved = localStorage.getItem("gemini_key");
    if (saved) {
      document.getElementById("apiKey").value = saved;
      document.getElementById("keyStatus").innerText = "Key loaded";
      document.getElementById("keyStatus").style.color = "green";
    }
  };

  function saveKey() {
    const val = document.getElementById("apiKey").value.trim();
    if (val) {
      localStorage.setItem("gemini_key", val);
      document.getElementById("keyStatus").innerText = "Saved";
      document.getElementById("keyStatus").style.color = "green";
    }
  }

  function getStoredKey() {
    const key = document.getElementById("apiKey").value.trim() || localStorage.getItem("gemini_key");
    if (!key) alert("Please enter and save your Gemini API key first.");
    return key;
  }

  function switchTab(mode) {
    document.getElementById("mainMode").style.display = mode === 'main' ? 'block' : 'none';
    document.getElementById("roleplayMode").style.display = mode === 'roleplay' ? 'block' : 'none';
    document.getElementById("tabBtn1").classList.toggle('active', mode === 'main');
    document.getElementById("tabBtn2").classList.toggle('active', mode === 'roleplay');
  }

  // Core Gemini Call
  async function callGemini(contents, systemInstruction = "") {
    const apiKey = getStoredKey();
    if (!apiKey) return null;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    const payload = { contents };

    if (systemInstruction) {
      payload.systemInstruction = {
        parts: [{ text: systemInstruction }]
      };
    }

    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || "Failed request");
    }

    const data = await response.json();
    return data.candidates[0].content.parts[0].text;
  }

  // Function 1: Random Topic Fetching & Answering
  async function fetchRandomTopic() {
    const btn = document.getElementById("randomBtn");
    btn.disabled = true;
    document.getElementById("keywordBox").innerText = "Generating prompt...";

    const prompt = "Generate a single random, interesting conversation keyword or statement for English practice (e.g., 'Remote Work vs Office Life', 'Is travel actually educational?', or 'Artificial Intelligence in art'). Return ONLY the topic/question phrase, without quotation marks.";
    
    try {
      const res = await callGemini([{ role: "user", parts: [{ text: prompt }] }]);
      document.getElementById("keywordBox").innerText = res.trim();
      document.getElementById("keywordReply").value = "";
      document.getElementById("keywordFeedback").style.display = "none";
    } catch (e) {
      document.getElementById("keywordBox").innerText = "Error: " + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function sendKeywordResponse() {
    const topic = document.getElementById("keywordBox").innerText;
    const answer = document.getElementById("keywordReply").value.trim();
    const mode = document.getElementById("practiceMode").value;
    const btn = document.getElementById("keywordSubmitBtn");

    if (!answer) {
      alert("Please enter a reply first.");
      return;
    }

    btn.disabled = true;
    document.getElementById("keywordFeedback").style.display = "block";
    document.getElementById("feedbackText").innerText = "Thinking...";

    let systemPrompt = "";
    if (mode === "test") {
      systemPrompt = "You are an English exam prep evaluator (like IELTS or TOEFL). Analyze the user's answer to the given topic. 1) Correct grammatical mistakes and suggest natural, higher-level vocabulary. 2) Provide a polished version of their answer. 3) Ask a follow-up test-style question.";
    } else {
      systemPrompt = "You are an intellectual, curious conversational partner. The user is sharing their view on a topic. Respond warmly, challenge their ideas constructively, bring in new angles or counterpoints, and start a deep, thought-provoking dialogue.";
    }

    const userMessage = `Topic: "${topic}"\nMy response: "${answer}"`;

    try {
      const feedback = await callGemini([{ role: "user", parts: [{ text: userMessage }] }], systemPrompt);
      document.getElementById("feedbackText").innerText = feedback;
    } catch (e) {
      document.getElementById("feedbackText").innerText = "Error: " + e.message;
    } finally {
      btn.disabled = false;
    }
  }

  // Function 2: Custom Roleplay
  function appendMessage(role, text) {
    const box = document.getElementById("chatHistory");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function sendRoleplayMessage() {
    const persona = document.getElementById("personaInput").value.trim();
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    const btn = document.getElementById("chatSendBtn");

    if (!text) return;

    appendMessage("user", text);
    input.value = "";
    btn.disabled = true;

    chatHistory.push({ role: "user", parts: [{ text }] });

    const systemPrompt = `You must roleplay fully as this character: ${persona}. Stay strictly in character, speak naturally in English, keep your replies conversational and appropriately paced, and reference your shared background naturally where relevant.`;

    try {
      const reply = await callGemini(chatHistory, systemPrompt);
      appendMessage("gemini", reply);
      chatHistory.push({ role: "model", parts: [{ text: reply }] });
    } catch (e) {
      appendMessage("gemini", "Error: " + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  function resetRoleplay() {
    chatHistory = [];
    document.getElementById("chatHistory").innerHTML = "";
  }
</script>

</body>
</html>
